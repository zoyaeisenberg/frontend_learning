<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Конкурс фф</title>
  </head>
  <body>
    <main>
      <form action="#" method="post">
        <p>
          <label for="name">Однажды</label>
          <input
            type="text"
            id="name"
            name="user_name"
            placeholder="имя автора"
          />
          <label for="ship"
            >поспорил(а), что напишет самый короткий фф способный растрогать
            любого по пейрингу:
          </label>
          <input
            type="text"
            id="ship"
            name="chosen_ship"
            placeholder="имя пейринга"
          />
        </p>
        <p>
          <label for="ff">Он(а) выиграл(а) спор:</label><br />
          <textarea id="ff" name="user_message">
Эл и Лайт Ягами не смогли наладить коммуникацию, потому что второй не выговаривает букву «л». 
        </textarea
          >
        </p>
        <p class="button">
          <button type="submit">Отправить фф</button>
        </p>
      </form>
    </main>
  </body>
</html>
